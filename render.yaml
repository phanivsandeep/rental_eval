services:
  - type: web
    name: rental-evaluator-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional — add these later to unlock full evaluation features
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: WALKSCORE_API_KEY
        sync: false
      - key: YELP_API_KEY
        sync: false
      - key: EPA_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
